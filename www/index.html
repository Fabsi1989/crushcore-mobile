<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CRUSHCORE MOBILE</title>
<style>
:root{--orange:#ff762b;--gold:#e5a84d;--bg:#08090d;--panel:#13151c;--line:#2b2d35;--text:#eee9e4;--muted:#9998a2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b1b22 0,#090a0e 60%);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;touch-action:manipulation;user-select:none}.app{max-width:520px;margin:auto;padding:14px 14px 28px}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 16px}.logo{font-weight:1000;letter-spacing:2px;color:var(--orange);font-size:23px;text-shadow:0 0 12px #ff762b55}.version{font-size:11px;color:var(--muted)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:linear-gradient(135deg,#191b23,#111218);border:1px solid var(--line);border-radius:13px;padding:12px}.stat small{color:var(--muted);font-size:10px;letter-spacing:1.2px}.stat strong{display:block;font-size:20px;margin-top:4px;color:#f4b36a}.object-card{margin-top:14px;background:linear-gradient(160deg,#1a1b23,#0f1015);border:1px solid #39333a;border-radius:18px;padding:14px;position:relative;overflow:hidden}.object-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.objname{font-weight:bold;color:#fff;letter-spacing:1px}.hpbar{height:11px;background:#292b31;border:1px solid #41434b;border-radius:99px;margin:12px 0 2px;overflow:hidden}.hpfill{height:100%;background:linear-gradient(90deg,#ff5724,#ffb32d);width:100%;transition:width .15s}.arena{height:270px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.object{font-size:128px;filter:drop-shadow(0 12px 10px #0009);transition:transform .08s;cursor:pointer}.object:active{transform:scale(.91) rotate(-3deg)}.tap-hint{position:absolute;bottom:9px;color:#777;font-size:11px;letter-spacing:2px}.float{position:absolute;color:#ff9d44;font-size:25px;font-weight:900;pointer-events:none;animation:float .75s ease-out forwards;text-shadow:0 0 10px #ff7a2b66}@keyframes float{0%{opacity:1;transform:translateY(0) scale(.7)}100%{opacity:0;transform:translateY(-65px) scale(1.3)}}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.btn{border:1px solid #5a3827;background:linear-gradient(135deg,#251a17,#17171c);color:#ffc17d;border-radius:12px;padding:13px 9px;font-weight:900;letter-spacing:.5px;font-size:12px}.btn:active{transform:scale(.97)}.btn.special{background:linear-gradient(100deg,#ff5626,#ff9c20);color:#180d07;border:0}.section{margin-top:17px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}.sectitle{display:flex;justify-content:space-between;align-items:center;color:var(--orange);font-weight:900;letter-spacing:1px;margin-bottom:10px}.upgrade{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #292b32;padding:10px 0}.upgrade:first-of-type{border-top:0}.upinfo{flex:1}.upinfo b{font-size:13px}.upinfo small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.buy{background:#22242b;border:1px solid #45464e;border-radius:8px;color:#eee;padding:9px 8px;font-weight:bold;font-size:11px;min-width:78px}.buy:disabled{opacity:.35}.footer{text-align:center;color:#65646e;font-size:10px;padding:18px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#25262c;border:1px solid #ff762b;color:#ffc17b;padding:11px 15px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1}.objselect{display:flex;gap:7px;margin-top:8px}.objselect button{flex:1;background:#191a20;border:1px solid #33343c;color:#aaa;border-radius:8px;padding:8px;font-size:11px}.objselect button.active{border-color:var(--orange);color:#ffb06a}.reset{font-size:10px;color:#666;text-decoration:underline;text-align:center;margin-top:12px}
</style></head><body><div class="app">
<div class="top"><div class="logo">☠ CRUSHCORE</div><div class="version">MOBILE PROTOTYPE v1.0</div></div>
<div class="stats"><div class="stat"><small>CRUSH COINS</small><strong id="coins">0</strong></div><div class="stat"><small>CLICK POWER</small><strong id="power">1</strong></div><div class="stat"><small>LEVEL</small><strong id="level">1</strong></div><div class="stat"><small>OBJECTS CRUSHED</small><strong id="crushed">0</strong></div></div>
<div class="object-card"><div class="object-head"><span class="objname" id="objname">POTATO #001</span><span id="hptext">100 / 100 HP</span></div><div class="hpbar"><div class="hpfill" id="hpfill"></div></div><div class="arena" id="arena"><div class="object" id="object">🥔</div><div class="tap-hint">TAP TO CRUSH</div></div><div class="object-head"><span id="objdesc">Basic target</span><span id="reward">+1 coin per hit</span></div></div>
<div class="buttons"><button class="btn special" id="special">💥 NUCLEAR CRUSH</button><button class="btn" id="auto">🤖 AUTO CRUSH: OFF</button></div>
<div class="section"><div class="sectitle">▰ OBJEKT AUSWÄHLEN</div><div class="objselect" id="objselect"></div></div>
<div class="section"><div class="sectitle">⚙ UPGRADES <span id="shopnote">Shop</span></div><div id="upgrades"></div></div>
<div class="reset" id="reset">Spielstand zurücksetzen</div><div class="footer">CRUSHCORE MOBILE · Spielstand wird lokal gespeichert</div></div><div class="toast" id="toast"></div>
<script>
const objects=[{name:'POTATO #001',emoji:'🥔',hp:100,desc:'Basic target',reward:1,unlock:0},{name:'METAL BARREL',emoji:'🛢️',hp:550,desc:'Heavy metal target',reward:3,unlock:150},{name:'CONCRETE BLOCK',emoji:'🧱',hp:1800,desc:'Solid concrete',reward:7,unlock:800},{name:'ROBOT SCRAP',emoji:'🤖',hp:6500,desc:'Mechanical wreck',reward:15,unlock:3500},{name:'CRUSHCORE BOSS',emoji:'☠️',hp:25000,desc:'Boss-class target',reward:50,unlock:15000}];
const upgrades=[{id:'power',name:'MEGA HAND',desc:'Mehr Schaden pro Tap',base:25,inc:1},{id:'crit',name:'CRITICAL FURY',desc:'Kritische Treffer werden stärker',base:120,inc:1},{id:'auto',name:'AUTO CRUSHER',desc:'Zerstört das Objekt automatisch',base:250,inc:1},{id:'mult',name:'LOOT MAGNET',desc:'Mehr Coins pro Treffer',base:180,inc:1}];
let s=JSON.parse(localStorage.getItem('crushcoreMobileSave')||'{}');s={coins:s.coins||0,powerLevel:s.powerLevel||0,critLevel:s.critLevel||0,autoLevel:s.autoLevel||0,multLevel:s.multLevel||0,crushed:s.crushed||0,objectIndex:s.objectIndex||0,level:s.level||1,hp:s.hp||objects[s.objectIndex||0].hp,autoOn:s.autoOn||false};let cooldown=false;
function save(){localStorage.setItem('crushcoreMobileSave',JSON.stringify(s))}function power(){return 1+s.powerLevel*2}function mult(){return 1+s.multLevel}function cost(id){let u=upgrades.find(x=>x.id===id),lv=s[id+'Level'];return Math.floor(u.base*Math.pow(1.65,lv))}function fmt(n){return Math.floor(n).toLocaleString('de-DE')}
function render(){let o=objects[s.objectIndex];if(s.hp<=0)s.hp=o.hp;document.getElementById('coins').textContent=fmt(s.coins);document.getElementById('power').textContent=fmt(power());document.getElementById('level').textContent=s.level;document.getElementById('crushed').textContent=fmt(s.crushed);document.getElementById('objname').textContent=o.name;document.getElementById('object').textContent=o.emoji;document.getElementById('objdesc').textContent=o.desc;document.getElementById('reward').textContent='+'+o.reward+' coins per hit';document.getElementById('hptext').textContent=fmt(s.hp)+' / '+fmt(o.hp)+' HP';document.getElementById('hpfill').style.width=Math.max(0,s.hp/o.hp*100)+'%';document.getElementById('auto').textContent='🤖 AUTO CRUSH: '+(s.autoOn?'ON':'OFF');document.getElementById('objselect').innerHTML=objects.map((x,i)=>`<button class="${i===s.objectIndex?'active':''}" ${s.coins<x.unlock?'disabled':''} onclick="selectObj(${i})">${x.emoji} ${i+1}</button>`).join('');document.getElementById('upgrades').innerHTML=upgrades.map(u=>{let lv=s[u.id+'Level'],c=cost(u.id);return `<div class="upgrade"><div class="upinfo"><b>${u.name} · LV ${lv}</b><small>${u.desc}</small></div><button class="buy" ${s.coins<c?'disabled':''} onclick="buy('${u.id}')">${fmt(c)} 🪙</button></div>`}).join('');save()}
function hit(multiplier=1){let damage=power()*multiplier;let crit=Math.random()<Math.min(.08+s.critLevel*.04,.5);if(crit)damage*=2+s.critLevel*.5;let o=objects[s.objectIndex];s.hp-=damage;s.coins+=o.reward*mult();let a=document.getElementById('arena'),f=document.createElement('div');f.className='float';f.textContent=(crit?'CRIT! ':'-')+fmt(damage);f.style.left=(25+Math.random()*50)+'%';f.style.top=(35+Math.random()*30)+'%';a.appendChild(f);setTimeout(()=>f.remove(),800);if(s.hp<=0){s.crushed++;s.level=Math.floor(s.crushed/10)+1;s.coins+=o.reward*10;toast(o.name+' ZERSTÖRT! BONUS +'+o.reward*10);s.objectIndex=Math.min(s.objectIndex+1,objects.length-1);s.hp=objects[s.objectIndex].hp;}render()}
function selectObj(i){if(s.coins<objects[i].unlock)return;s.objectIndex=i;s.hp=objects[i].hp;render()}function buy(id){let c=cost(id);if(s.coins<c)return;s.coins-=c;s[id+'Level']++;render();toast('UPGRADE GEKAUFT!')}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
document.getElementById('object').addEventListener('click',()=>hit());document.getElementById('special').addEventListener('click',()=>{if(cooldown)return;cooldown=true;hit(25);toast('NUCLEAR CRUSH!');setTimeout(()=>cooldown=false,8000)});document.getElementById('auto').addEventListener('click',()=>{s.autoOn=!s.autoOn;render()});document.getElementById('reset').addEventListener('click',()=>{if(confirm('Spielstand wirklich zurücksetzen?')){localStorage.removeItem('crushcoreMobileSave');location.reload()}});setInterval(()=>{if(s.autoOn&&s.autoLevel>0)hit(s.autoLevel)},1000);render();
</script></body></html>
